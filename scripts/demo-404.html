<!doctype html>
<!-- 404 del sitio de la demostración. scripts/build-demo.mjs reemplaza el
     marcador BASE_PATH de más abajo. GitHub Pages sirve este archivo para
     cualquier ruta que no
     exista, de ahí que viva en la raíz del sitio y no dentro de un rol. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Kinesis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eff4f1; --ink: #0e1d18; --muted: #4c5c56;
    --action: #1b7f56; --wash-a: #dcefe4; --wash-b: #eff4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070b0a; --ink: #ecf4f0; --muted: #9db3aa;
      --action: #6fd08c; --wash-a: #0b1a14; --wash-b: #070b0a;
    }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: "Nunito", ui-sans-serif, system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(135deg, var(--wash-a), var(--bg) 55%, var(--wash-b));
  }
  div { max-width: 32rem; text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
  a { color: var(--action); font-weight: 700; }
</style>
</head>
<body>
  <div>
    <h1>Esta página no existe en la demostración</h1>
    <p>
      La demostración solo incluye las pantallas de cada rol. Si llegaste
      siguiendo un enlace de la aplicación real, esa pantalla necesita
      servidor y no se publica aquí.
    </p>
    <a href="{{BASE_PATH}}/">Volver al inicio de la demostración</a>
  </div>
</body>
</html>
