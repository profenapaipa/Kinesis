<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo de Kinesis, mismo trazo que components/brand/BrandMark.tsx. Los
       colores van fijos porque la pestaña del navegador no conoce los tokens
       de la app; son los del color "Kinesis" (verde bosque) de lib/theme.ts,
       el predeterminado, con su tono claro para el modo oscuro. -->
  <style>
    .bg { fill: #1b7f56; }
    .mark { stroke: #ffffff; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #6fd08c; }
      .mark { stroke: #05231a; }
      .dot { fill: #05231a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="9" />
  <g class="mark" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 8v16" />
    <path d="M11.5 17.5 18 11" />
    <path d="M14 15l6.5 9" />
  </g>
  <circle class="dot" cx="22.2" cy="6.8" r="2.4" />
</svg>
