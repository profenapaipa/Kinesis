<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opciones de tipografía PIAR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Nunito:wght@400;700;900&family=Lexend:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500&family=Sora:wght@400;600;800&family=DM+Sans:wght@400;500&family=Outfit:wght@400;600;800&family=Figtree:wght@400;500&display=swap">
<style>
:root{--bg:#eceef1;--tx:#1d2430;--mut:#5b6573;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:20px 14px 40px}
h1{font:700 22px/1.2 system-ui,sans-serif;margin:0 0 6px}
.intro{color:var(--mut);margin:0 0 24px;max-width:60ch}
.opt{margin-bottom:34px}
.opt h2{font:700 18px/1.2 system-ui,sans-serif;margin:0}
.opt p{margin:4px 0 12px;color:var(--mut);max-width:62ch;font-size:14px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ph{border-radius:16px;padding:18px;max-width:340px}
.light{background:#fafaf8;color:#24303f;border:1px solid #dcdfe4}
.dark{background:#16222b;color:#e8f1f2;border:1px solid #243541}
.ph .sm{font-size:12px;opacity:.65;margin:2px 0 14px}
.ph h3{margin:0;font-size:26px;line-height:1.15}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;border-radius:10px;padding:9px 8px}
.light .stat{background:#fff;border:1px solid #e3e5e9}
.dark .stat{background:#1d2e39}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:11px;opacity:.7}
.light .stat b{color:#4f6378}
.dark .stat b{color:#3fd9c4}
.row{border-radius:10px;padding:10px 12px;margin-bottom:8px}
.light .row{background:#fff;border:1px solid #e3e5e9}
.dark .row{background:#1d2e39;border-left:3px solid #3fd9c4}
.row b{display:block;font-size:14px}
.row span{font-size:12px;opacity:.7}
.btn{margin-top:6px;text-align:center;border-radius:10px;padding:11px;font-size:14px;font-weight:600}
.light .btn{background:#5b7088;color:#fff}
.dark .btn{background:#3fd9c4;color:#08201d}
@media (prefers-color-scheme:dark){:root{--bg:#101418;--tx:#e8ecf0;--mut:#9aa5b1}}
</style>
</head>
<body>
<h1>Tipografías para tu app de estudiantes, docentes y familias</h1>
<p class="intro">Cada opción se ve en la Dirección B (clara y serena) y en la Dirección C (vibrante, modo oscuro), con el mismo contenido para que compares solo la letra.</p>
<div id="root"></div>
<script>
const opts=[
["1. Plus Jakarta Sans","Títulos y texto con la misma familia","Moderna, limpia y cálida. Se siente profesional sin ser rígida. La opción más equilibrada.","'Plus Jakarta Sans'","'Plus Jakarta Sans'",800],
["2. Nunito","Títulos y texto con la misma familia","Terminaciones redondeadas: es la más amable y juvenil. Perfecta si quieres cercanía.","'Nunito'","'Nunito'",900],
["3. Lexend","Títulos y texto con la misma familia","Diseñada para facilitar la lectura. Encaja con un proyecto de inclusión como PIAR.","'Lexend'","'Lexend'",800],
["4. Fraunces + Inter","Títulos serif, texto sans","La más formal. El título con serifa transmite confianza y el texto Inter mantiene todo ágil.","'Fraunces'","'Inter'",800],
["5. Sora + DM Sans","Títulos geométricos, texto suave","Tecnológica y juvenil. Los títulos tienen carácter y el texto es muy legible en pantallas pequeñas.","'Sora'","'DM Sans'",800],
["6. Outfit + Figtree","Títulos redondos, texto amable","Geométrica y amigable, con aire de app moderna. Funciona muy bien en modo oscuro.","'Outfit'","'Figtree'",800]
];
const card=(m,h,b,w)=>`<div class="ph ${m}" style="font-family:${b},system-ui,sans-serif">
<div class="sm">${m=='light'?'Dirección B · modo claro':'Dirección C · modo oscuro'}</div>
<h3 style="font-family:${h},system-ui,sans-serif;font-weight:${w}">Hola, Camila</h3>
<div class="sm">8°-A · Hoy tienes 3 clases</div>
<div class="stats"><div class="stat"><b style="font-family:${h}">10</b><span>Estudiantes</span></div><div class="stat"><b style="font-family:${h}">3</b><span>Con PIAR activo</span></div><div class="stat"><b style="font-family:${h}">5/9</b><span>Con planeación</span></div></div>
<div class="row"><b style="font-family:${h};font-weight:600">Matemáticas</b><span>Sistemas de ecuaciones</span></div>
<div class="row"><b style="font-family:${h};font-weight:600">Ciencias Naturales</b><span>Genética y herencia</span></div>
<div class="btn" style="font-family:${h}">Nueva actividad</div></div>`;
document.getElementById('root').innerHTML=opts.map(o=>`<section class="opt"><h2>${o[0]}</h2><p><b>${o[1]}.</b> ${o[2]}</p><div class="pair">${card('light',o[3],o[4],o[5])}${card('dark',o[3],o[4],o[5])}</div></section>`).join('');
</script>
</body>
</html>
